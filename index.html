<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：畫面延伸到瀏海／圓角區，介面再以 safe-area 內距避開；禁止縮放避免操作時誤觸放大 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2420" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="河岸日和" />
    <title>河岸日和</title>
    <!-- 開場封面：寫在網頁本身，遊戲程式還在下載時就能先顯示。
         背景圖為無字版（原檔：素材/無字封面.png），標題用真正的字型以 HTML／CSS 排版，不畫進圖片。 -->
    <link rel="preload" as="image" href="/assets/opt/cover.webp" media="(min-width: 700px)" />
    <link rel="preload" as="image" href="/assets/opt/cover-sm.webp" media="(max-width: 699px)" />
    <!-- 標題字型：思源宋體（Noto Serif TC）。text= 只下載標題用到的字，檔案只有數 KB；離線時改用系統的宋體／明體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=block&text=%E6%B2%B3%E5%B2%B8%E6%97%A5%E5%92%8C%E5%9C%A8%E5%B0%8F%E6%9D%91%E8%A3%A1%EF%BC%8C%E6%85%A2%E9%81%8E%E5%AD%90" />
    <style>
      #loading {
        --tea: #4a2c1c;       /* 深茶褐：主標 */
        --tea-soft: #5e3d29;  /* 副標、讀取文字 */
        --serif: "Noto Serif TC", "Source Han Serif TC", "思源宋體", "Songti TC", "PMingLiU", "MingLiU", serif;
        position: fixed; inset: 0; z-index: 50; overflow: hidden;
        background: #2b2420; color: var(--tea);
        font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif;
        transition: opacity 0.6s ease; touch-action: none; user-select: none; -webkit-user-select: none;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading:focus { outline: none; }

      /* 背景：同一張封面放大模糊，填滿封面以外的區域 */
      #loading .ld-blur {
        position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px);
        object-fit: cover; filter: blur(24px) brightness(0.72);
      }
      /* 封面舞台：與圖片同比例、完整顯示；標題與讀取條以舞台寬度（cqw）定位，任何螢幕都落在畫面上相同位置 */
      #loading .ld-stage {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(100vw, calc(100vh * 1672 / 941));
        width: min(100vw, calc(100dvh * 1672 / 941));
        aspect-ratio: 1672 / 941; container-type: inline-size;
      }
      #loading .ld-stage picture, #loading .ld-art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #loading .ld-art { object-fit: cover; }

      /* 標題：左上的天空留白處（避開右側主角與貓、中央的村落） */
      #loading .ld-title { position: absolute; left: 5.2cqw; top: 5.4cqw; margin: 0; }
      #loading .ld-title h1 {
        margin: 0; font-family: var(--serif); font-weight: 700; color: var(--tea);
        font-size: clamp(30px, 6.6cqw, 120px); line-height: 1.15; letter-spacing: 0.14em;
        /* 只有極淡的暖光，讓字在晚霞上更乾淨；不做描邊、立體或重陰影 */
        text-shadow: 0 0 0.4em rgba(255, 236, 222, 0.35);
      }
      /* 副標：小一級，整行留在天空裡（不跨進中央的樹與屋頂） */
      #loading .ld-title p {
        margin: 1.2cqw 0 0 0.18em; font-family: var(--serif); font-weight: 500; color: var(--tea-soft);
        font-size: clamp(13px, 1.95cqw, 34px); line-height: 1.4; letter-spacing: 0.16em;
        text-shadow: 0 0 0.5em rgba(255, 236, 222, 0.35);
      }

      /* 讀取條：左下河面上的一張半透明紙卡，進度線前端是一顆釣魚浮標 */
      #loading .ld-panel {
        --p: 0%;
        position: absolute; left: 5.2cqw; bottom: 4.2cqw;
        width: clamp(200px, 30cqw, 420px); /* 右緣停在浮標（約 40%）左側 */
        padding: 13px 18px 15px; border-radius: 14px;
        background: rgba(255, 249, 240, 0.8);
        -webkit-backdrop-filter: blur(8px) saturate(1.1); backdrop-filter: blur(8px) saturate(1.1);
        border: 1px solid rgba(110, 72, 44, 0.28);
        box-shadow: 0 10px 28px rgba(60, 30, 15, 0.22);
      }
      #loading .ld-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 11px; }
      #loading .ld-text { font-size: 14px; font-weight: 600; letter-spacing: 0.12em; color: var(--tea-soft); }
      #loading .ld-pct { font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--tea); font-variant-numeric: tabular-nums; }
      #loading .ld-track { position: relative; height: 6px; border-radius: 3px; background: rgba(110, 72, 44, 0.16); }
      #loading .ld-fill {
        position: absolute; left: 0; top: 0; bottom: 0; width: var(--p); border-radius: 3px;
        background: linear-gradient(90deg, #ecc277, #d9894f); transition: width 0.25s ease;
      }
      #loading .ld-bob {
        position: absolute; top: 50%; left: var(--p); width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px;
        border-radius: 50%; border: 1.5px solid var(--tea);
        background: linear-gradient(#d0503f 0 50%, #fffaf2 50% 100%);
        box-shadow: 0 2px 4px rgba(60, 30, 15, 0.25);
        transition: left 0.25s ease; animation: ld-bob 1.6s ease-in-out infinite;
      }
      @keyframes ld-bob { 50% { transform: translateY(-2px); } }
      /* 遊戲程式還在下載（還沒有實際進度）：浮標在線上來回漂 */
      #loading.waiting .ld-fill { width: 0; }
      #loading.waiting .ld-bob { animation: ld-drift 2.2s ease-in-out infinite alternate, ld-bob 1.6s ease-in-out infinite; }
      @keyframes ld-drift { from { left: 4%; } to { left: 96%; } }

      /* 載入完成：等玩家輕觸開始（同時啟用背景音樂） */
      #loading.ready { cursor: pointer; }
      #loading .ld-start { text-align: center; }
      #loading .ld-start-text {
        font-size: 16px; font-weight: 700; letter-spacing: 0.16em; color: var(--tea);
        animation: ld-breathe 2s ease-in-out infinite;
      }
      #loading .ld-start-note { margin-top: 5px; font-size: 12px; letter-spacing: 0.04em; color: #7a5a44; }
      @keyframes ld-breathe { 50% { opacity: 0.55; } }

      /* 手機橫向：卡片縮小一點 */
      @media (max-height: 430px) {
        #loading .ld-panel { padding: 9px 14px 11px; border-radius: 12px; }
        #loading .ld-row { margin-bottom: 8px; }
        #loading .ld-text { font-size: 12px; }
        #loading .ld-pct { font-size: 13px; }
        #loading .ld-start-text { font-size: 14px; }
        #loading .ld-start-note { font-size: 11px; margin-top: 3px; }
      }
      /* 直向：封面上移，讀取卡片放在封面下方（封面太小，疊在河面上會遮到景物） */
      /* 直向：封面變得很小，標題移到封面上方、讀取卡片放在封面下方，都不疊在圖上 */
      @media (orientation: portrait) {
        #loading .ld-blur { filter: blur(26px) brightness(1.08) saturate(0.9); }
        #loading .ld-stage { top: 50%; border-radius: 4px; box-shadow: 0 10px 30px rgba(60, 30, 15, 0.25); }
        #loading .ld-title {
          left: 50%; top: auto; bottom: calc(100% + 26px); transform: translateX(-50%);
          width: 100vw; text-align: center;
        }
        #loading .ld-title h1 { font-size: clamp(34px, 11vw, 64px); letter-spacing: 0.16em; margin-right: -0.16em; }
        #loading .ld-title p { font-size: clamp(14px, 4.2vw, 22px); margin: 10px -0.16em 0 0; }
        #loading .ld-panel {
          left: 50%; bottom: auto; top: calc(100% + 28px); transform: translateX(-50%);
          width: min(320px, 86vw);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .ld-bob, #loading.waiting .ld-bob, #loading .ld-start-text { animation: none; }
        #loading.waiting .ld-bob { left: 50%; }
      }
    </style>
  </head>
  <body>
    <div id="loading" class="waiting" role="status" aria-live="polite">
      <img class="ld-blur" src="/assets/opt/cover-sm.webp" alt="" aria-hidden="true" />
      <div class="ld-stage">
        <picture>
          <source media="(max-width: 699px)" srcset="/assets/opt/cover-sm.webp" />
          <img class="ld-art" src="/assets/opt/cover.webp" alt="" />
        </picture>
        <div class="ld-title">
          <h1>河岸日和</h1>
          <p>在小村裡，慢慢過日子</p>
        </div>
        <div class="ld-panel">
          <div class="ld-row"><span class="ld-text">載入中</span><span class="ld-pct"></span></div>
          <div class="ld-track"><div class="ld-fill"></div><div class="ld-bob"></div></div>
        </div>
      </div>
    </div>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
